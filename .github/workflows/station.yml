
name: Citi Bike Station Ingestion

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: station-ingestion
  cancel-in-progress: false

jobs:
  collect-stations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect Citi Bike stations
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: python extract_station.py
